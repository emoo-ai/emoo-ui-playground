<!doctype html>
<html lang="zh-hans">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="../favicon.png" />
    <title>EMOO UI · 组件预览 · React</title>
    <!-- 预置（四页同款）：暗色防闪白 + 主色速涂；18 项派生色由应用挂载后经 shared/theme.ts 补全 -->
    <script>
      ;(function () {
        try {
          var t = localStorage.getItem('emoo-pg-theme')
          if (t === 'dark' || (t == null && matchMedia('(prefers-color-scheme: dark)').matches))
            document.documentElement.classList.add('dark')
          var c = localStorage.getItem('emoo-pg-color')
          if (/^#[0-9a-f]{6}$/i.test(c || '')) {
            var s = document.documentElement.style
            s.setProperty('--emoo-color-primary', c)
            s.setProperty(
              '--emoo-color-primary-rgb',
              parseInt(c.slice(1, 3), 16) + ', ' + parseInt(c.slice(3, 5), 16) + ', ' + parseInt(c.slice(5, 7), 16)
            )
          }
        } catch (e) {}
      })()
    </script>
